name: Scrape & Notify Swimming Schedule

on:
  schedule:
    # Runs every Sunday at 19:00 UTC (which is 20:00 CET winter time / 21:00 CEST summer time)
    - cron: '0 19 * * 0'
  # Enables a manual "Run workflow" button directly in the GitHub web interface
  workflow_dispatch:

jobs:
  run-scraper:
    name: Run Swimming Pool Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Scraper & Send Notification
        env:
          NTFY_TOPIC_URL: 'https://ntfy.sh/zwem-rooster-breda'
        run: node scraper.js
