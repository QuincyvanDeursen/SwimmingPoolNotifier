name: Scrape & Notify Swimming Schedule

on:
  schedule:
    # Runs every Sunday at 19:00 UTC (which is 20:00 CET winter time / 21:00 CEST summer time)
    - cron: '0 19 * * 0'
  # Enables a manual "Run workflow" button directly in the GitHub web interface
  workflow_dispatch:

jobs:
  run-scraper:
    name: Run Swimming Pool Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Solution
        run: dotnet build --configuration Release

      - name: Install Playwright Browsers & Dependencies
        run: pwsh SwimmingPoolScheduleNotifier/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Scraper & Send Notification
        env:
          NTFY_TOPIC_URL: 'https://ntfy.sh/zwem-rooster-breda'
          POOL_SCHEDULE_URLS: 'https://www.optisport.nl/activiteiten/banenzwemmen/zwembad-de-wisselaar-breda#locatie,https://www.optisport.nl/activiteiten/banenzwemmen/zwembad-sonsbeeck-breda#locatie'
        run: dotnet run --no-build --configuration Release --project SwimmingPoolScheduleNotifier/SwimmingPoolScheduleNotifier.csproj
